name: Actualizar datos diarios

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC todos los días
  workflow_dispatch:       # también ejecutable a mano

permissions:
  contents: write          # necesario para que el bot pueda hacer push

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements-datos.txt

      - name: 1. Actualizar datos de mercado (df_merged)
        run: python src/data/actualizar_diario.py

      - name: 2. Calcular régimen del día (HMM)
        run: python src/data/actualizar_regimenes.py

      - name: 3. Calcular features (df_model)
        run: python src/data/calcular_features.py

      - name: 4. Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/csv/
          git diff --staged --quiet || git commit -m "Actualización automática $(date +%Y-%m-%d)"
          git push